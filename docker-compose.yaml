version: "1"

services:
  comfyui:
    container_name: comfyui
    hostname: comfyui
    build: .
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - 8188:8188
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - ./outputs:/outputs
      - ./data:/data
